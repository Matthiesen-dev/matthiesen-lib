name: Publish Release to Maven and Modrinth

on:
  release:
    types: [ published ]

env:
  MOD_NAME: Matthiesen Lib
  ARTIFACT_BASENAME: matthiesen-lib
  RELEASE_JARS_ARTIFACT_PREFIX: release-jars
  MODRINTH_GAME_VERSION: 1.21.1
  MODRINTH_DEPENDENCIES: |-
    [
      {"project_id":"OVSg4uGN","dependency_type":"optional"}
    ]

  # TODO: Move this into the MODRINTH_DEPENDENCIES once the API mod is ready and has a stable version.
  # {"project_id":"j2JrSWnx","dependency_type":"required"},

  ## Lib Dependencies:
  # - j2JrSWnx: Matthiesen Lib API (required)
  # - OVSg4uGN: Ember's Text API (optional)

  API_MOD_NAME: Matthiesen Lib API
  ARTIFACT_API_BASENAME: matthiesen-lib-api
  API_RELEASE_JARS_ARTIFACT_PREFIX: api-release-jars
  API_MODRINTH_GAME_VERSION: 1.21.1

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parsed_version.outputs.version }}
      is_snapshot: ${{ steps.parsed_version.outputs.is_snapshot }}
    steps:
      - name: Parse the version number from the event tag
        id: parsed_version
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          is_snapshot=false
          if [[ "$version" == *"-SNAPSHOT" ]]; then
            is_snapshot=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_snapshot=$is_snapshot" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prime API platform jars for Loom metadata resolution
        run: ./gradlew :api-common:build :api-fabric:remapJar :api-neoforge:remapJar --configure-on-demand

      - name: Build with Gradle and Publish to DevMatthiesenMavenRepository
        run: ./gradlew build publishAllPublicationsToDevMatthiesenMavenRepository
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ORG_GRADLE_PROJECT_devMatthiesenMavenUsername: ${{ secrets.ORG_GRADLE_PROJECT_DEVMATTHIESENMAVENUSERNAME }}
          ORG_GRADLE_PROJECT_devMatthiesenMavenPassword: ${{ secrets.ORG_GRADLE_PROJECT_DEVMATTHIESENMAVENPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}

      - name: Copy jars for publishing
        if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
        run: ./gradlew copyJars

      - name: Upload jars artifact for downstream release jobs
        if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_JARS_ARTIFACT_PREFIX }}-${{ needs.prepare.outputs.version }}
          path: output/*.jar

      - name: Upload Jars to GitHub Release
        if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
        uses: softprops/action-gh-release@v1
        with:
          files: output/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

