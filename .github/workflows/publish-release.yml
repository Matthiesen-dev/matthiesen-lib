name: Publish Release to Maven and Modrinth

on:
  release:
    types: [ published ]

env:
  MOD_NAME: Matthiesen Lib
  ARTIFACT_BASENAME: matthiesen-lib
  RELEASE_JARS_ARTIFACT_PREFIX: release-jars
  MODRINTH_GAME_VERSION: 1.21.1
  MODRINTH_DEPENDENCIES: >-
    [{"project_id":"OVSg4uGN","dependency_type":"optional"}]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parsed_version.outputs.version }}
      is_snapshot: ${{ steps.parsed_version.outputs.is_snapshot }}
    steps:
      - name: Parse the version number from the event tag
        id: parsed_version
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          is_snapshot=false
          if [[ "$version" == *"-SNAPSHOT" ]]; then
            is_snapshot=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_snapshot=$is_snapshot" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle and Publish to DevMatthiesenMavenRepository
        run: ./gradlew build publishAllPublicationsToDevMatthiesenMavenRepository
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ORG_GRADLE_PROJECT_devMatthiesenMavenUsername: ${{ secrets.ORG_GRADLE_PROJECT_DEVMATTHIESENMAVENUSERNAME }}
          ORG_GRADLE_PROJECT_devMatthiesenMavenPassword: ${{ secrets.ORG_GRADLE_PROJECT_DEVMATTHIESENMAVENPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}

      - name: Copy jars for publishing
        if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
        run: ./gradlew copyJars

      - name: Upload jars artifact for downstream release jobs
        if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_JARS_ARTIFACT_PREFIX }}-${{ needs.prepare.outputs.version }}
          path: output/*.jar

      - name: Upload Jars to GitHub Release
        if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
        uses: softprops/action-gh-release@v1
        with:
          files: output/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_modrinth:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            name_suffix: Fabric
          - loader: neoforge
            name_suffix: NeoForge
    steps:
      - name: Download release jars artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RELEASE_JARS_ARTIFACT_PREFIX }}-${{ needs.prepare.outputs.version }}
          path: output

      - name: Publish ${{ matrix.name_suffix }} mod to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ secrets.MODRINTH_ID }}
          name: ${{ format('{0} {1} - {2}', env.MOD_NAME, needs.prepare.outputs.version, matrix.name_suffix) }}
          version: ${{ needs.prepare.outputs.version }}
          changelog: ${{ github.event.release.body }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ env.MODRINTH_GAME_VERSION }}
          files: output/${{ env.ARTIFACT_BASENAME }}-${{ matrix.loader }}-${{ needs.prepare.outputs.version }}.jar
          dependencies: ${{ env.MODRINTH_DEPENDENCIES }}

  sync_modrinth_description:
    needs: [prepare, publish_modrinth]
    if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Sync Project Description on Modrinth
        uses: funnyboy-roks/modrinth-auto-desc@v1.7
        with:
          auth-token: ${{ secrets.MODRINTH_TOKEN }}
          slug: ${{ secrets.MODRINTH_ID }}