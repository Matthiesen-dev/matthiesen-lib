name: Publish Release to Maven and Modrinth

on:
  release:
    types: [ published ]

env:
  API_MOD_NAME: Matthiesen Lib API
  API_ARTIFACT_BASENAME: matthiesen-lib-api
  API_RELEASE_JARS_ARTIFACT_PREFIX: api-release-jars
  API_MODRINTH_ID: j2JrSWnx
  API_MODRINTH_GAME_VERSION: 1.21.1
  # API Dependencies:
  # - lzVo0Dll: Fabric Permissions API (optional)
  API_MODRINTH_DEPENDENCIES: |-
    []
  API_MODRINTH_DEPENDENCIES_FABRIC: |-
    [
      {"project_id":"lzVo0Dll","dependency_type":"optional"}
    ]

  LIB_MOD_NAME: Matthiesen Lib
  LIB_ARTIFACT_BASENAME: matthiesen-lib
  LIB_RELEASE_JARS_ARTIFACT_PREFIX: release-jars
  LIB_MODRINTH_ID: cPmFkPpB
  LIB_MODRINTH_GAME_VERSION: 1.21.1
  # Lib Dependencies:
  # - j2JrSWnx: Matthiesen Lib API (required)
  # - lzVo0Dll: Fabric Permissions API (optional)
  # - OVSg4uGN: Ember's Text API (optional)
  LIB_MODRINTH_DEPENDENCIES: |-
    [
      {"project_id":"j2JrSWnx","dependency_type":"required"},
      {"project_id":"OVSg4uGN","dependency_type":"optional"}
    ]
  LIB_MODRINTH_DEPENDENCIES_FABRIC: |-
    [
      {"project_id":"lzVo0Dll","dependency_type":"optional"}
    ]

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parsed_version.outputs.version }}
      is_snapshot: ${{ steps.parsed_version.outputs.is_snapshot }}
    steps:
      - name: Parse the version number from the event tag
        id: parsed_version
        run: |
          version="${{ github.event.release.tag_name }}"
          version="${version#v}"
          is_snapshot=false
          if [[ "$version" == *"-SNAPSHOT" ]]; then
            is_snapshot=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "is_snapshot=$is_snapshot" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Executable Permissions
        run: chmod +x ./gradlew ./bootstrap.sh

      - name: Prime API platform jars for Loom metadata resolution
        run: ./bootstrap.sh

      - name: Build with Gradle and Publish to DevMatthiesenMavenRepository
        run: ./gradlew build publishAllPublicationsToDevMatthiesenMavenRepository
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          ORG_GRADLE_PROJECT_devMatthiesenMavenUsername: ${{ secrets.ORG_GRADLE_PROJECT_DEVMATTHIESENMAVENUSERNAME }}
          ORG_GRADLE_PROJECT_devMatthiesenMavenPassword: ${{ secrets.ORG_GRADLE_PROJECT_DEVMATTHIESENMAVENPASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_SIGNINGINMEMORYKEYPASSWORD }}

      - name: Copy jars for publishing
        if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
        run: ./gradlew copyJars

      - name: Upload jars artifact for downstream release jobs
        if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.LIB_RELEASE_JARS_ARTIFACT_PREFIX }}-${{ needs.prepare.outputs.version }}
          path: output/*.jar

      - name: Upload Jars to GitHub Release
        if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
        uses: softprops/action-gh-release@v1
        with:
          files: output/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish_api_modrinth:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            name_suffix: Fabric
          - loader: neoforge
            name_suffix: NeoForge
    steps:
      - name: Download release jars artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.API_RELEASE_JARS_ARTIFACT_PREFIX }}-${{ needs.prepare.outputs.version }}

      - name: Get Dependency list for Modrinth
        id: get_dependencies
        # Get the env.API_MODRINTH_DEPENDENCIES JSON array, and if we are in fabric, append the Fabric Permissions API as an optional dependency, and if we are in neoforge, do nothing.
        run: |
          dependencies='${{ env.API_MODRINTH_DEPENDENCIES }}'
          fabric_dependencies='${{ env.API_MODRINTH_DEPENDENCIES_FABRIC }}'
          if [[ "${{ matrix.loader }}" == "fabric" ]]; then
              dependencies=$(echo "$dependencies" | jq '. += $fabric_dependencies')
          fi
          
          echo "dependencies=$dependencies" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.name_suffix }} API mod to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ env.API_MODRINTH_ID }}
          name: ${{ format('{0} {1} - {2}', env.API_MOD_NAME, needs.prepare.outputs.version, matrix.name_suffix) }}
          version: ${{ needs.prepare.outputs.version }}
          changelog: ${{ github.event.release.body }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ env.API_MODRINTH_GAME_VERSION }}
          files: output/${{ env.API_ARTIFACT_BASENAME }}-${{ matrix.loader }}-${{ needs.prepare.outputs.version }}.jar
          dependencies: ${{ steps.get_dependencies.outputs.dependencies }}

  sync_api_modrinth_description:
    needs: [prepare, publish_api_modrinth]
    if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Sync API Project Description on Modrinth
        uses: funnyboy-roks/modrinth-auto-desc@v1.7
        with:
          readme: 'api/README.md'
          auth-token: ${{ secrets.MODRINTH_TOKEN }}
          slug: ${{ env.API_MODRINTH_ID }}

  publish_lib_modrinth:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: fabric
            name_suffix: Fabric
          - loader: neoforge
            name_suffix: NeoForge
    steps:
      - name: Download release jars artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.LIB_RELEASE_JARS_ARTIFACT_PREFIX }}-${{ needs.prepare.outputs.version }}
          path: output

      - name: Get Dependency list for Modrinth
        id: get_dependencies
        # Get the env.LIB_MODRINTH_DEPENDENCIES JSON array, and if we are in fabric, append the Fabric Permissions API as an optional dependency, and if we are in neoforge, do nothing.
        run: |
            dependencies='${{ env.LIB_MODRINTH_DEPENDENCIES }}'
            fabric_dependencies='${{ env.LIB_MODRINTH_DEPENDENCIES_FABRIC }}'
            if [[ "${{ matrix.loader }}" == "fabric" ]]; then
                dependencies=$(echo "$dependencies" | jq '. += $fabric_dependencies')
            fi
    
            echo "dependencies=$dependencies" >> "$GITHUB_OUTPUT"

      - name: Publish ${{ matrix.name_suffix }} mod to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ env.LIB_MODRINTH_ID }}
          name: ${{ format('{0} {1} - {2}', env.LIB_MOD_NAME, needs.prepare.outputs.version, matrix.name_suffix) }}
          version: ${{ needs.prepare.outputs.version }}
          changelog: ${{ github.event.release.body }}
          loaders: ${{ matrix.loader }}
          game-versions: ${{ env.LIB_MODRINTH_GAME_VERSION }}
          files: output/${{ env.LIB_ARTIFACT_BASENAME }}-${{ matrix.loader }}-${{ needs.prepare.outputs.version }}.jar
          dependencies: ${{ steps.get_dependencies.outputs.dependencies }}

  sync_lib_modrinth_description:
    needs: [prepare, publish_lib_modrinth]
    if: ${{ needs.prepare.outputs.is_snapshot == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Sync Project Description on Modrinth
        uses: funnyboy-roks/modrinth-auto-desc@v1.7
        with:
          readme: 'lib/README.md'
          auth-token: ${{ secrets.MODRINTH_TOKEN }}
          slug: ${{ env.LIB_MODRINTH_ID }}